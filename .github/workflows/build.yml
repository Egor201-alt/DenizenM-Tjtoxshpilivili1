name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore Spigot cache
        id: spigot-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/spigotmc
          key: spigot-bt-1.21.11-26.1.2-26.2-26.3-v1

      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"

      - name: Build Spigot with BuildTools
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/bt"
          cd "$HOME/bt"
          curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          for rev in 26.3 26.2 26.1.2; do
            java -jar BuildTools.jar --rev "$rev" --disable-java-check
          done
          java -jar BuildTools.jar --rev 1.21.11 --remapped --disable-java-check

      - name: Save Spigot cache
        if: always() && steps.spigot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/spigotmc
          key: spigot-bt-1.21.11-26.1.2-26.2-26.3-v1

      - name: Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <profiles>
              <profile>
                <id>citizens</id>
                <repositories>
                  <repository>
                    <id>citizens-repo</id>
                    <url>https://maven.citizensnpcs.co/repo</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>citizens</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: Build DenizenM-Core
        run: |
          git clone --depth 1 --branch main https://github.com/Energobro/DenizenM-Core.git "$HOME/core"
          cd "$HOME/core"
          mvn -B -ntp install -DskipTests

      - name: Pin Citizens version if 2.0.41-SNAPSHOT is unavailable
        run: |
          if ! mvn -B -ntp -q dependency:get -Dartifact=net.citizensnpcs:citizens-main:2.0.41-SNAPSHOT -Dtransitive=false; then
            grep -rl "2.0.41-SNAPSHOT" --include=pom.xml . | xargs sed -i 's/2.0.41-SNAPSHOT/2.0.44-SNAPSHOT/g'
          fi

      - name: Build Denizen
        run: mvn -B -ntp

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Denizen-jar
          path: |
            target/*.jar
            dist/target/*.jar
          if-no-files-found: error
